<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖沙咀 午餐餐廳</title>
<script>
(function () {
  function siteRoot() {
    if (!location.hostname.endsWith(".github.io")) return location.origin + "/";
    var parts = location.pathname.split("/").filter(Boolean);
    if (parts.length >= 2) return location.origin + "/" + parts[0] + "/";
    return location.origin + "/";
  }
  var next = new URL(siteRoot());
  next.search = location.search;
  next.hash = location.hash;
  if (next.href !== location.href) location.replace(next.href);
})();
</script>
</head>
<body>
<p>頁面不存在，正在返回首頁。</p>
</body>
</html>
